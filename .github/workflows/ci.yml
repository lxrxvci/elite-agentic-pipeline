name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmos/packages/domain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'test/*.test.ts'

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: firmos/src/frontend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/firmos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firmos/src/frontend/package-lock.json
      - run: npm ci
      - name: Migrations apply cleanly from empty
        run: npm run db:migrate
      - name: Server engine tests
        run: npm run test:server

  frontend:
    runs-on: ubuntu-latest
    env:
      # Placeholder only - next build imports db/index.ts which throws when
      # DATABASE_URL is unset; postgres.js connects lazily, so no service.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/firmos
    defaults:
      run:
        working-directory: firmos/src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firmos/src/frontend/package-lock.json
      - name: Vendored domain copy is in sync
        run: |
          chmod +x firmos/scripts/*.sh
          firmos/scripts/check-domain-sync.sh
        working-directory: ${{ github.workspace }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: npm run build

  # A11y gate: axe-core over the key pages (e2e/a11y.spec.ts). Needs the real
  # app built and seeded - Playwright's webServer config does both.
  a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: firmos/src/frontend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/firmos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firmos/src/frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:a11y
