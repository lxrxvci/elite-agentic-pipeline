openapi: 3.1.0
info:
  title: FirmOS HTTP surface (MVP wedge)
  version: 0.1.0
  description: >-
    FirmOS mutations flow through Next.js server actions (typed RPC), not a public
    REST API (see docs/rfc/0001-firmos-wedge.md). This spec documents the HTTP
    routes that exist at the edge: health probe and inbound webhooks.
    The public REST/GraphQL API is deferred until that bet is shaped; this file
    will grow when it ships.
servers:
  - url: https://firmos.vercel.app
    description: Production
  - url: https://firmos-staging.vercel.app
    description: Staging
paths:
  /api/health:
    get:
      summary: Liveness/readiness probe
      operationId: getHealth
      tags: [ops]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  db: { type: string, enum: [ok, degraded] }
                required: [status]
  /api/webhooks/stripe:
    post:
      summary: Stripe webhook receiver (metered per-client billing events)
      operationId: stripeWebhook
      tags: [billing]
      security: []   # verified via Stripe signature header, not bearer auth
      parameters:
        - name: stripe-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
      responses:
        '200': { description: Event accepted }
        '400': { description: Invalid signature or payload }
  /api/inngest:
    post:
      summary: Inngest handler — durable jobs (materialization, overdue checks, digests)
      operationId: inngestHandler
      tags: [jobs]
      security: []   # authenticated via Inngest signature scheme
      responses:
        '200': { description: Acknowledged }
components:
  schemas:
    StripeEvent:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        data:
          type: object
      required: [id, type, data]
tags:
  - name: ops
  - name: billing
  - name: jobs
