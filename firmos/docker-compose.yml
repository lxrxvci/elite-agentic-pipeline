# FirmOS local development stack — intentionally minimal.
# Postgres 16 only; everything else runs directly on the host.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firmos
    ports:
      # 5433 on the host to avoid clashing with any local Postgres on 5432.
      - "5433:5432"
    volumes:
      - firmos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmos"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  firmos_pgdata:
