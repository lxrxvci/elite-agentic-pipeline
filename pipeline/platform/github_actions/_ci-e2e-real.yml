name: CI — Real Backend E2E

on:
  workflow_call:
    inputs:
      project-dir:
        required: false
        type: string
        default: firmos
      node-version:
        required: true
        type: string

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start backend services
        working-directory: ${{ inputs.project-dir }}
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: |
          docker compose up -d db redis backend
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Backend is healthy"
              break
            fi
            echo "Waiting for backend..."
            sleep 2
          done
          curl -fsS --retry 10 --retry-delay 3 http://localhost:8000/health
          # Sanity: the dev-login endpoint the E2E journey uses must be live
          curl -fsS -X POST http://localhost:8000/api/v1/auth/token \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-smoke@example.com"}' | head -c 200

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.project-dir }}/src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ inputs.project-dir }}/src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ${{ inputs.project-dir }}/src/frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-backend E2E tests
        working-directory: ${{ inputs.project-dir }}/src/frontend
        run: npm run test:e2e:real

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-real-report
          path: ${{ inputs.project-dir }}/src/frontend/playwright-report
